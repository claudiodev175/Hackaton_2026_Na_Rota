<div class="app-layout">
  <!-- ABA 1: INÍCIO (Se já tem dados cadastrados, exibe o S.O.S. Se não, exibe o formulário inicial) -->
  <ng-container *ngIf="telaAtual() === 'inicio'">
    <app-tela-sos
      *ngIf="dadosUsuario; else formularioInicial"
      [dadosUsuario]="dadosUsuario"
      (abrirAbrigos)="irParaAbrigos()"
      (editarLocal)="dadosUsuario = undefined">
    </app-tela-sos>

    <ng-template #formularioInicial>
      <app-inicio-rapido (dadosConfirmados)="aoConfirmarDados($event)"></app-inicio-rapido>
    </ng-template>
  </ng-container>

  <!-- ABA 2: ABRIGOS -->
  <app-lista-abrigos
    *ngIf="telaAtual() === 'abrigos'"
    [enderecoUsuario]="dadosUsuario?.endereco || ''"
    [quantidadePessoas]="dadosUsuario?.quantidadePessoas || 1"
    [temPrioridade]="dadosUsuario?.temPrioridade || false">
  </app-lista-abrigos>

  <!-- ABA 3: IDENTIFICAÇÃO (Formulário rápido de grupo e localização) -->
  <app-inicio-rapido
    *ngIf="telaAtual() === 'identificacao'"
    (dadosConfirmados)="aoConfirmarDados($event)">
  </app-inicio-rapido>

  <!-- ABA 4: CONTATOS (Central com Bombeiros, Defesa Civil, SAMU e órgãos de enchentes) -->
  <!-- Aba CONTATOS -->
  <app-contatos
    *ngIf="telaAtual() === 'contatos'"
    (abrirAbrigos)="irParaAbrigos()">
  </app-contatos>

  <!-- ABA 5: INSTRUÇÕES DE RESGATE -->
  <app-instrucoes
    *ngIf="telaAtual() === 'instrucoes'">
  </app-instrucoes>

  <!-- BARRA DE NAVEGAÇÃO INFERIOR FIXA (Em todas as telas) -->
  <app-bottom-nav
    [abaAtual]="telaAtual()"
    (mudarAba)="navegarPara($event)">
  </app-bottom-nav>

</div>
