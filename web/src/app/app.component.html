<div class="app-layout">
  <!-- S.O.S. só aparece depois que a identificação foi concluída. -->
  <app-tela-sos
    *ngIf="telaAtual() === 'sos' && dadosUsuario"
    [dadosUsuario]="dadosUsuario"
    (abrirAbrigos)="irParaAbrigos()"
    (editarLocal)="editarLocal()">
  </app-tela-sos>

  <!-- Identificação permanece como uma tela independente do S.O.S. -->
  <app-inicio-rapido
    *ngIf="telaAtual() === 'identificacao' || (telaAtual() === 'sos' && !dadosUsuario)"
    (dadosConfirmados)="aoConfirmarDados($event)">
  </app-inicio-rapido>

  <!-- ABA 2: ABRIGOS -->
  <app-lista-abrigos
    *ngIf="telaAtual() === 'abrigos'"
    [enderecoUsuario]="dadosUsuario?.endereco || ''"
    [coordenadasUsuario]="dadosUsuario?.coordenadas"
    [quantidadePessoas]="dadosUsuario?.quantidadePessoas || 1"
    [temPrioridade]="dadosUsuario?.temPrioridade || false">
  </app-lista-abrigos>

  <!-- ABA 4: CONTATOS (Central com Bombeiros, Defesa Civil, SAMU e órgãos de enchentes) -->
  <!-- Aba CONTATOS -->
  <app-contatos
    *ngIf="telaAtual() === 'contatos'"
    (abrirAbrigos)="irParaAbrigos()">
  </app-contatos>

  <!-- ABA 5: INSTRUÇÕES DE RESGATE -->
  <app-instrucoes
    *ngIf="telaAtual() === 'instrucoes'">
  </app-instrucoes>

  <!-- BARRA DE NAVEGAÇÃO INFERIOR FIXA (Em todas as telas) -->
  <app-bottom-nav
    [abaAtual]="telaAtual()"
    (mudarAba)="navegarPara($event)">
  </app-bottom-nav>

</div>
